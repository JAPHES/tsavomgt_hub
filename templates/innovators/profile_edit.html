{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<header class="profile-edit-heading">
    <p class="eyebrow">My profile</p>
    <h1>Edit personal details</h1>
    <p>Email, registration number, projects, role and booking history cannot be changed here.</p>
</header>

<div class="card content-card narrow-card profile-edit-card">
    <div class="card-body p-4 p-lg-5">
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <div class="profile-edit-actions">
                <a class="btn btn-light" href="{% url 'innovators:profile' %}">Cancel</a>
                <button class="btn btn-primary" type="submit">Save profile</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
